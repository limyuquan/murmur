<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Lookahead: hls.js</title>
    <style>body { margin: 0; } video { display: block; width: 640px; height: 360px; background: #000; }</style>
  </head>
  <body>
    <video id="player" muted playsinline></video>
    <script src="lookahead-common.js"></script>
    <script src="/lib/hls.min.js"></script>
    <script>
      const hls = new Hls();
      hls.on(Hls.Events.ERROR, (_e, d) => d.fatal && playback.errors.push(`hls:${d.details}`));
      hls.loadSource('lookahead/hls/master.m3u8');
      hls.attachMedia(video);
      hls.on(Hls.Events.MANIFEST_PARSED, () => video.play().catch((e) => playback.errors.push(`play:${e}`)));
    </script>
  </body>
</html>
