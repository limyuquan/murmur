<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Shadow player fixture</title>
    <style>
      body { margin: 0; font: 14px system-ui, sans-serif; }
      main { padding: 24px; }
      shadow-player { display: block; width: 960px; height: 540px; }
    </style>
  </head>
  <body>
    <main>
      <div id="slot"></div>
      <div class="actions">
        <button id="fs-video" type="button" onclick="document.querySelector('shadow-player').shadowRoot.querySelector('video').requestFullscreen()">Video full screen</button>
        <button id="fs-host" type="button" onclick="document.querySelector('shadow-player').shadowRoot.getElementById('frame').requestFullscreen()">Player full screen</button>
      </div>
    </main>
    <script>
      // A web-component player: its video lives in an open shadow root. `?late`: the player
      // appears a moment after the page loads.
      customElements.define(
        'shadow-player',
        class extends HTMLElement {
          constructor() {
            super();
            this.attachShadow({ mode: 'open' }).innerHTML = `
              <style>
                #frame { position: relative; width: 100%; height: 100%; background: #000; }
                video { display: block; width: 100%; height: 100%; object-fit: contain; }
              </style>
              <div id="frame"><video src="clip.webm" muted autoplay loop playsinline></video></div>`;
          }
        },
      );
      const add = () => document.getElementById('slot').append(document.createElement('shadow-player'));
      if (new URLSearchParams(location.search).has('late')) setTimeout(add, 1500);
      else add();
    </script>
  </body>
</html>
