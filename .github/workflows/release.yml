# Builds the extension zip and attaches it to a GitHub Release. Runs when a version tag is pushed
# (git tag v0.1.0 && git push origin v0.1.0), or by hand from the Actions tab for an existing tag.
#
# Assets (each also reachable at releases/latest/download/<name>):
#   earshot-chrome.zip            the extension, stable name
#   earshot-<version>-chrome.zip  the same file, versioned name
#   SHA256SUMS
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release (e.g. v0.1.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v$version" = "$TAG" || { echo "Tag $TAG doesn't match package.json version $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: pnpm check
      # `pnpm zip` is the production build, which keeps the manifest `key` (fixed extension ID).
      # Never `zip:store` here: that build is for a Chrome Web Store upload only.
      - run: pnpm zip
      - name: Check the zip keeps the fixed extension ID and minimal permissions
        run: node scripts/verify-zip.mjs ".output/earshot-$VERSION-chrome.zip"
      - name: Collect the assets
        run: |
          mkdir release
          cp ".output/earshot-$VERSION-chrome.zip" release/
          cp ".output/earshot-$VERSION-chrome.zip" release/earshot-chrome.zip
          (cd release && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="https://github.com/${{ github.repository }}"
          cat > notes.md <<EOF
          Download **earshot-$VERSION-chrome.zip**, unzip it somewhere permanent, then in Chrome open
          \`chrome://extensions\`, turn on **Developer mode**, click **Load unpacked** and choose the
          unzipped folder. To update, replace the folder's contents and click ↻ on Earshot's card.
          Full steps: [README]($repo#install).
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --title "Earshot $TAG" --notes-file notes.md
          fi
