# Builds the extension zip and attaches it to a GitHub Release. Runs when a version tag is pushed
# (git tag v0.1.0 && git push origin v0.1.0), or by hand from the Actions tab for an existing tag.
#
# Assets (each also reachable at releases/latest/download/<name>):
#   murmur-chrome.zip            the extension, stable name
#   murmur-<version>-chrome.zip  the same file, versioned name
#   SHA256SUMS
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing tag to build and release (e.g. v0.1.0)
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ env.TAG }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches package.json
        run: |
          version="$(node -p "require('./package.json').version")"
          test "v$version" = "$TAG" || { echo "Tag $TAG doesn't match package.json version $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - run: pnpm check
      # `pnpm zip` is the production build, which keeps the manifest `key` (fixed extension ID).
      - run: pnpm zip
      - name: Check the zip (fixed extension ID, permissions, required files, no test hooks)
        run: node scripts/verify-zip.mjs ".output/murmur-$VERSION-chrome.zip"
      - name: Collect the assets
        run: |
          mkdir release
          cp ".output/murmur-$VERSION-chrome.zip" release/
          cp ".output/murmur-$VERSION-chrome.zip" release/murmur-chrome.zip
          (cd release && sha256sum -- * > SHA256SUMS && cat SHA256SUMS)
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          repo="https://github.com/${{ github.repository }}"
          cat > notes.md <<EOF
          Download **murmur-$VERSION-chrome.zip**, unzip it somewhere permanent, then in Chrome open
          \`chrome://extensions\`, turn on **Developer mode**, click **Load unpacked** and choose the
          unzipped folder. To update, replace the folder's contents and click ↻ on Murmur's card.
          Full steps: [README]($repo#install).
          EOF
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" release/* --clobber
          else
            gh release create "$TAG" release/* --title "Murmur $TAG" --notes-file notes.md
          fi
