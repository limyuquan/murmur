# Checks every push and pull request: typecheck, lint, unit tests, then the headless e2e suite.
# The `build` job also uploads the extension zip as a workflow artifact, so a build can be tried
# without tagging a release.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: Install Chromium for Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: E2E (headless)
        run: pnpm test:e2e
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: test-results/
          retention-days: 7

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm zip
      - name: Check the zip keeps the fixed extension ID and minimal permissions
        run: node scripts/verify-zip.mjs .output/murmur-*-chrome.zip
      - uses: actions/upload-artifact@v4
        with:
          name: murmur-${{ github.sha }}
          path: .output/murmur-*-chrome.zip
          retention-days: 30
